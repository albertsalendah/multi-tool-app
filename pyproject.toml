[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multitool-cli"
version = "0.1.0"
description = "Command-line client for the Multi Tool App REST API."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
multitool = "cli.main:main"

[tool.setuptools.packages.find]
# Only package the CLI client itself. app/, tools/, libraries/, tests/
# are the server side and are intentionally NOT part of this install -
# the CLI talks to a running server over HTTP, it doesn't embed the
# Kernel (see docs/ARCHITECTURE_CHANGELOG.md, "Current Focus").
include = ["cli*"]
