app:
  name: Multi Tool App
  debug: false

browser:
  headless: true
  timeout: 30000

jobs:
  max_workers: 4
  completed_ttl_seconds: 3600
  max_completed_jobs: 500
  shutdown_timeout_seconds: 10.0

scheduler:
  completed_ttl_seconds: 3600
  max_completed_schedules: 500

logging:
  level: INFO
  file: logs/app.log
  console: true
  file_output: true